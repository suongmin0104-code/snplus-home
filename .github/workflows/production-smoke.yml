name: SN production smoke

on:
  push:
    branches:
      - main
    paths:
      - "bollard.html"
      - "bollard.css"
      - "bollard.js"
      - "script.js"
      - "api/contact.js"
      - "public/sitemap.xml"
      - "vercel.json"
      - "vite.config.mjs"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sn-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production landing and inquiry routes
        shell: bash
        run: |
          set -euo pipefail

          base_url="https://snplus.ai.kr"
          page_file="$(mktemp)"
          root_file="$(mktemp)"
          script_file="$(mktemp)"
          sitemap_file="$(mktemp)"
          api_file="$(mktemp)"
          analytics_file="$(mktemp)"

          fetch_code() {
            local url="$1"
            local output="$2"
            curl --location --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 45 \
              --output "$output" --write-out '%{http_code}' "$url" || true
          }

          ready="false"
          page_code="000"
          for attempt in $(seq 1 30); do
            page_code="$(fetch_code "$base_url/bollard" "$page_file")"
            if [[ "$page_code" == "200" ]] && grep -Fq "볼라드 제작·교체·시공" "$page_file" && grep -Fq "data-bollard-form" "$page_file"; then
              ready="true"
              break
            fi
            echo "Attempt $attempt: bollard landing HTTP ${page_code:-unknown}"
            sleep 10
          done

          if [[ "$ready" != "true" ]]; then
            echo "::error::Production bollard landing did not become ready. Last HTTP status: ${page_code:-unknown}"
            head -c 800 "$page_file" || true
            exit 1
          fi

          root_code="$(fetch_code "$base_url/" "$root_file")"
          script_code="$(fetch_code "$base_url/bollard.js" "$script_file")"
          sitemap_code="$(fetch_code "$base_url/sitemap.xml" "$sitemap_file")"
          api_code="$(fetch_code "$base_url/api/contact" "$api_file")"
          analytics_code="$(fetch_code "$base_url/_vercel/insights/script.js" "$analytics_file")"

          echo "Homepage HTTP: $root_code"
          echo "Bollard landing HTTP: $page_code"
          echo "Bollard JavaScript HTTP: $script_code"
          echo "Sitemap HTTP: $sitemap_code"
          echo "Contact API GET guard HTTP: $api_code"
          echo "Vercel Analytics script HTTP: ${analytics_code:-unknown}"

          if [[ "$root_code" != "200" ]]; then
            echo "::error::Homepage returned HTTP $root_code"
            head -c 800 "$root_file" || true
            exit 1
          fi
          if [[ "$script_code" != "200" ]]; then
            echo "::error::Bollard JavaScript returned HTTP $script_code"
            head -c 800 "$script_file" || true
            exit 1
          fi
          if [[ "$sitemap_code" != "200" ]]; then
            echo "::error::Sitemap returned HTTP $sitemap_code"
            head -c 800 "$sitemap_file" || true
            exit 1
          fi
          if [[ "$api_code" != "405" ]]; then
            echo "::error::Contact API GET guard returned HTTP $api_code instead of 405"
            cat "$api_file" || true
            exit 1
          fi

          grep -Fq "주식회사 에스앤" "$root_file" || { echo "::error::Homepage company name missing"; exit 1; }
          grep -Fq "Quote Submitted" "$script_file" || { echo "::error::Conversion event marker missing from bollard.js"; exit 1; }
          grep -Fq "snplus.ai.kr/bollard" "$sitemap_file" || { echo "::error::Bollard URL missing from sitemap"; exit 1; }

          {
            echo "## SN production smoke"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Homepage | HTTP $root_code |"
            echo "| Bollard landing | HTTP $page_code, required copy and form found |"
            echo "| Bollard JavaScript | HTTP $script_code, conversion event found |"
            echo "| Sitemap | HTTP $sitemap_code, /bollard found |"
            echo "| Contact API GET guard | HTTP $api_code |"
            echo "| Vercel Analytics script | HTTP ${analytics_code:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"
